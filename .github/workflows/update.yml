name: Aggiorna Playlist IPTV

on:
  schedule:
    - cron: '0 12 * * 6' # Avvio automatico ogni sabato alle 12:00 UTC
  workflow_dispatch: # Permette l'avvio manuale con un click

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4

      - name: Esegui Scraper
        run: python scraper.py

      - name: Salva e aggiorna playlist.m3u
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          touch playlist.m3u
          git add playlist.m3u
          git commit -m "Aggiornamento playlist IPTV" || exit 0
          git push
